<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Sitio Web{% endblock %}</title>
    <!-- Conectamos con el archivo CSS de la carpeta static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>Mi Increíble Sitio Web con Python 🚀</h1>
    </header>

    <nav>
        <a href="/">Inicio</a>
        <a href="/acerca">Acerca de</a>
        <a href="/contacto">Contacto</a>
    </nav>

    <div class="container">
        <!-- Aquí se inyectará el contenido de cada página -->
        {% block content %}{% endblock %}
    </div>

</body>
</html>
